<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeSee | Instale o aplicativo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="./img/WeSeeIcon.png" alt="">
    </header>

    <main>
        <section class="mainSection">
            <section class="hero">
                <h2>Mais autonomia para sua mobilidade.</h2>
                <p>
                    O WeSee utiliza tecnologia de visão computacional
                    para auxiliar pessoas com baixa visão na identificação
                    de elementos ao seu redor.
                </p>

                <a class="download" href="#">
                    Baixar aplicativo
                </a>
                <div id="avaiable">
                    <small>Disponível para Android</small>
                </div>
            </section>
        </section>
        <section id="celularSection">
            <img src="./img/CelularWeSee.svg" alt="" id="celular">
            <div id="cardsContainer">
                <div id="card">
                    <img src="./img/EyesIcon.svg" alt="" id="image">
                </div>
                <div id="card">
                    <img src="./img/mapsIcon.svg" alt="" id="image">
                </div>
                <div id="card">
                    <img src="./img/AndroidIcon.svg" id="image" alt="">
                </div>
            </div>
        </section>

    </main>

</body>

</html>
